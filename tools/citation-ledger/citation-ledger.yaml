      source: "OWASP Top 10 for LLM Applications 2026 (published 2026-08-04). Canonical source: github.com/GenAI-Security-Project/GenAI-LLM-Top10 2026/final/ (commit 9253e38); version DOI 10.5281/zenodo.22109015"
      verified_on: "2026-10-02"
      ids:
        LLM01: { name: "Prompt Injection", status: verified }
        LLM02: { name: "Sensitive Information Disclosure", status: verified }
        LLM03: { name: "Excessive Agency", status: verified }
        LLM04: { name: "Supply Chain", status: verified }
