        LLM02: { name: "Sensitive Information Disclosure", status: verified }
        LLM03: { name: "Supply Chain", status: verified }
        LLM04: { name: "Data and Model Poisoning", status: verified }
        LLM05: { name: "Improper Output Handling", status: verified }
        LLM06: { name: "Excessive Agency", status: verified }
        LLM07: { name: "System Prompt Leakage", status: verified }
        LLM08: { name: "Vector and Embedding Weaknesses", status: verified }
        LLM09: { name: "Misinformation", status: verified }
        LLM10: { name: "Unbounded Consumption", status: verified }
