# citation-ledger.yaml
#
# Tier-0 citation ledger for AI Risk Practice.
# Canonical registry of enumerable framework IDs (the low-redundancy fact class
# that LLMs assert confidently and store unreliably — the Issue #19 / F-1 failure
# mode). A deterministic checker (check_citations.py) verifies every cited ID in
# the KB and the training scenarios against this registry. No LLM is in the loop.
#
# PRINCIPLE: this ledger is a CHECKER, never an ORACLE. Every entry is either
# `verified` (confirmed against an authoritative source, named below) or
# `cannot_verify` (could not be confirmed this cycle — the checker flags it for a
# human to check against the primary source; it is NEVER given a guessed value).
#
# Verified during the 2026-06-28 build session against: MITRE ATLAS knowledge-base
# JSON (MISP galaxy mirror) + Splunk ATLAS detection mapping; the official EU AI
# Act text (artificialintelligenceact.eu / euaiact.com / EC AI Act Service Desk);
# OWASP Top 10 for LLM Applications 2025 (v2.0, published 2024-11-18).
#
# To refresh: re-verify against the source, bump `verified_on`, change status.
# Sub-technique IDs are volatile (ATLAS went 66->84 techniques Oct2025->Feb2026):
# prefer citing the stable parent in prose and pinning the precise ID here.

meta:
  version: "0.1"
  built_on: "2026-06-28"
  note: "Prototype seed scoped to IDs actually cited across the KB and training corpora."

mitre-atlas:
  source: "MITRE ATLAS knowledge base (MISP galaxy mirror) + Splunk ATLAS mapping"
  verified_on: "2026-06-28"
  ids:
    AML.T0005:
      name: "Create Proxy ML Model"
      status: verified
    AML.T0020:
      name: "Poison Training Data"
      aliases: ["Training Data Poisoning"]
      status: verified
    AML.T0051:
      name: "LLM Prompt Injection"
      status: verified
    AML.T0051.000:
      name: "LLM Prompt Injection: Direct"
      aliases: ["Direct Prompt Injection"]
      status: verified
    AML.T0051.001:
      name: "LLM Prompt Injection: Indirect"
      aliases: ["Indirect Prompt Injection via Retrieved Content", "Indirect Prompt Injection"]
      status: verified
    AML.T0054:
      name: "LLM Jailbreak"
      status: verified
    AML.T0054.003:
      name: null
      status: retired
      note: "RESOLVED 2026-07-10: nonexistent ID. c2-prompt-injection cited AML.T0054.003 for indirect injection via MCP/tool responses; correct technique is AML.T0051.001 (LLM Prompt Injection: Indirect). Corrected in the entry. Grounding: OWASP GenAI LLM01 cross-references and MISP ATLAS galaxy both list AML.T0051 sub-techniques .000 Direct / .001 Indirect / .002 Triggered; AML.T0054 is LLM Jailbreak with no .003. Matches ai-risk-training fix (commit e18bed5)."
    AML.T0051.001: { name: "LLM Prompt Injection: Indirect", status: verified }

owasp-llm:
  source: "OWASP Top 10 for LLM Applications 2025 (v2.0, 2024-11-18)"
  version: "2025"
  verified_on: "2026-06-28"
  note: "LLM06 and LLM09 changed meaning between the 2023 and 2025 lists. A bare 'LLM06' is only correct if it means Excessive Agency (2025)."
  ids:
    LLM01: { name: "Prompt Injection", status: verified }
    LLM02: { name: "Sensitive Information Disclosure", status: verified }
    LLM03: { name: "Supply Chain", status: verified }
    LLM04: { name: "Data and Model Poisoning", status: verified }
    LLM05: { name: "Improper Output Handling", status: verified }
    LLM06: { name: "Excessive Agency", status: verified }
    LLM07: { name: "System Prompt Leakage", status: verified }
    LLM08: { name: "Vector and Embedding Weaknesses", status: verified }
    LLM09: { name: "Misinformation", status: verified }
    LLM10: { name: "Unbounded Consumption", status: verified }

