name: Check and deploy

# Builds on every pull request and push. A push to main also deploys to
# Cloudflare Pages (project ai-risk-library), which serves
# library.airiskpractice.org since the move off GitHub Pages on 17 Nov 2026.
#
# Deploying needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with
# the "Cloudflare Pages: Edit" permission) and CLOUDFLARE_ACCOUNT_ID. Until
# they exist the deploy job says so and stops without failing the run.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Keyed per ref: every PR gets its own lane, so a batch of PRs no longer
# cancels its own siblings (a cancelled run is easily misread as a failure).
# Real deploys all run on refs/heads/main and so still serialise against
# each other, which is the property this concurrency block exists to protect.
concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

  # Deploys only on push to main (or manual dispatch), never from a PR, so
  # unreviewed branches cannot reach production. It rebuilds rather than
  # passing an artifact between jobs.
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://library.airiskpractice.org/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so nothing was deployed. Add both as repository secrets."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ok == 'true'
        run: npm ci

      - name: Build site
        if: steps.creds.outputs.ok == 'true'
        run: npm run build

      - name: Publish to Cloudflare Pages
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages deploy build --project-name=ai-risk-library --branch=main --commit-dirty=true
