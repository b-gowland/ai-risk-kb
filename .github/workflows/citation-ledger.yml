name: citation-ledger (strict)

# Tier-0 citation ledger check. STRICT: blocks on NAME_MISMATCH, UNKNOWN_ID,
# or CANNOT_VERIFY. Flipped 2026-07-10 after the gate cleared: both
# human-check items resolved (f2 Art. 29->26; c2 AML.T0054.003->AML.T0051.001)
# and 36/36 citations verify clean.

on:
  push:
    paths:
      - "docs/**/*.mdx"
      - "docs/**/*.md"
      - "tools/citation-ledger/**"
  pull_request:
    paths:
      - "docs/**/*.mdx"
      - "docs/**/*.md"
      - "tools/citation-ledger/**"
  workflow_dispatch:

jobs:
  citation-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Run citation ledger check (strict) on KB
        run: |
          python3 tools/citation-ledger/check_citations.py --strict \
            --ledger tools/citation-ledger/citation-ledger.yaml \
            docs | tee citation-report.txt

      - name: Self-test (F-1 regression)
        run: |
          python3 tools/citation-ledger/check_citations.py --self-test

      - name: Surface report in job summary
        if: always()
        run: |
          {
            echo '## Citation ledger (advisory)';
            echo '```';
            cat citation-report.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

