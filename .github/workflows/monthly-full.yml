name: Monthly — Full maintenance run

on:
  schedule:
    # 1st of every month at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      entry:
        description: 'Optional: single entry ID to run (e.g. C2). Leave blank for all.'
        required: false
        default: ''

# Explicit minimum permissions
permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-full
  cancel-in-progress: false

jobs:
  full-maintenance:
    name: Full maintenance pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Install the exact, hash-verified versions from automation/uv.lock
      # (an unpinned `pip install anthropic` let CI drift to whatever PyPI served).
      - name: Install dependencies
        run: |
          python -m pip install uv==0.8.17
          cd automation
          uv sync --frozen --no-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate entry input
        if: github.event.inputs.entry != ''
        # Pass via env, never interpolate ${{ }} into the script: the value is
        # untrusted until this step has validated it.
        env:
          ENTRY_INPUT: ${{ github.event.inputs.entry }}
        run: |
          if ! echo "$ENTRY_INPUT" | grep -qE '^[A-Za-z0-9-]{1,10}$'; then
            echo "ERROR: Invalid entry value — must be 1-10 alphanumeric characters (e.g. C2, A1)"
            exit 1
          fi

      - name: Run full maintenance pass
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENTRY_ID: ${{ github.event.inputs.entry }}
        run: |
          cd automation
          if [ -n "$ENTRY_ID" ]; then
            echo "Running single-entry mode for: $ENTRY_ID"
            python automation_engine.py --mode single --entry "$ENTRY_ID"
          else
            echo "Running full maintenance pass across all entries"
            python automation_engine.py --mode full
          fi

      - name: List reports
        if: always()
        run: ls -la automation/reports/ || echo "No reports directory found"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-reports-${{ github.run_id }}
          path: automation/reports/
          retention-days: 90
          if-no-files-found: warn

      - name: Create GitHub issue if human review required
        # Off main (e.g. a test dispatch on a branch) nothing is published.
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportsDir = 'automation/reports';

            if (!fs.existsSync(reportsDir)) {
              console.log('No reports directory found — nothing to review.');
              return;
            }

            const files = fs.readdirSync(reportsDir);
            const reviewFiles = files
              .filter(f => f.startsWith('human_review_'))
              .sort().reverse();

            if (reviewFiles.length === 0) {
              console.log('No human review items — run completed cleanly.');
              return;
            }

            const reviewDoc = fs.readFileSync(
              path.join(reportsDir, reviewFiles[0]), 'utf8'
            );

            if (!reviewDoc.includes('## Item')) {
              console.log('Human review document is empty — no action required.');
              return;
            }

            const itemCount = (reviewDoc.match(/## Item \d+/g) || []).length;
            let summary = '';
            const verifyFiles = files.filter(f => f.startsWith('verification_')).sort().reverse();
            const gapFiles = files.filter(f => f.startsWith('gaps_')).sort().reverse();
            const monitorFiles = files.filter(f => f.startsWith('monitoring_')).sort().reverse();

            if (verifyFiles.length > 0) {
              const vReport = fs.readFileSync(path.join(reportsDir, verifyFiles[0]), 'utf8');
              const corrections = (vReport.match(/### [A-G]\d/g) || []).length;
              summary += `- **Verification:** ${corrections} correction(s) found\n`;
            }
            if (gapFiles.length > 0) {
              const gReport = fs.readFileSync(path.join(reportsDir, gapFiles[0]), 'utf8');
              const blocking = (gReport.match(/\*\*[A-G]\d\*\*/g) || []).length;
              summary += `- **Gap detection:** ${blocking} gap(s) flagged\n`;
            }
            if (monitorFiles.length > 0) {
              const mReport = fs.readFileSync(path.join(reportsDir, monitorFiles[0]), 'utf8');
              const actions = (mReport.match(/flag_for_review|draft_update/g) || []).length;
              summary += `- **Monitoring:** ${actions} source(s) with new content\n`;
            }

            const runDate = new Date().toISOString().split('T')[0];
            const issueBody = [
              `## Monthly maintenance run — ${itemCount} item(s) require review`,
              '',
              `Run date: ${runDate}`,
              `Run ID: ${context.runId}`,
              '',
              '### Summary',
              summary || '- See full review document below',
              '',
              '---',
              '',
              reviewDoc.substring(0, 60000),
              '',
              '---',
              '',
              '_Created automatically by the monthly maintenance workflow. Review each item, mark your decision (Approve / Reject / Modify), and close the issue when complete._',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Monthly maintenance] ${itemCount} item(s) require human review — ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: ['automation', 'human-review-required', 'monthly-maintenance']
            });

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `[Monthly maintenance] run failed`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'automation',
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `Failed again: ${runUrl}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: `The scheduled run failed: ${runUrl}\n\nCheck the logs (e.g. Anthropic API credit balance), fix, then re-run via workflow_dispatch and close this issue.`,
              labels: ['automation'],
            });

      - name: Post run summary
        if: always()
        env:
          ENTRY_ID: ${{ github.event.inputs.entry }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## Monthly maintenance run: $JOB_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run date:** $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${ENTRY_ID:+single-entry ($ENTRY_ID)}${ENTRY_ID:-full}" >> $GITHUB_STEP_SUMMARY
          echo "**Cost:** depends on entry length and extracted claim count" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "automation/reports" ]; then
            echo "**Reports generated:**" >> $GITHUB_STEP_SUMMARY
            ls automation/reports/ | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          fi
